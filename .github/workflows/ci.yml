name: CI

on:
  push:
    branches: [main]
  pull_request:

# least privilege for GITHUB_TOKEN: every job only reads the checkout
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # reads the Bun version from package.json#packageManager
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Prepare test directories
        run: mkdir -p __tests__/pptx-output __tests__/pptx-cache

      - name: Test
        run: bun run test

  # Tier 2 (ROADMAP Phase 5): OOXML schema validation of every written
  # archive via the Open XML SDK, packaged in a Docker image so neither
  # contributors nor CI need a .NET toolchain. Fails only on error classes
  # not covered by tools/validate-pptx/allowlist.json.
  validate-pptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # reads the Bun version from package.json#packageManager
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare test directories
        run: mkdir -p __tests__/pptx-output __tests__/pptx-cache

      - name: Generate output archives
        run: bun run test

      - name: Validate templates and outputs (Tier 2)
        run: bun run validate:pptx

  # Tier 3 (ROADMAP Phase 5): perceptual diff of curated golden decks against
  # committed baselines, rendered by the pinned pptx-thumbnailer container
  # (tools/render-pptx). Baselines mean "what the pinned renderer showed when
  # a human last blessed them" — on an intended visual change, regenerate with
  # UPDATE_BASELINES=1 bun run test:visual in the same PR.
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # reads the Bun version from package.json#packageManager
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare test directories
        run: mkdir -p __tests__/pptx-output __tests__/pptx-cache

      - name: Golden decks vs. baselines (Tier 3)
        run: bun run test:visual

      - name: Upload failure evidence (actual + diff PNGs)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: __tests__/visual-output/
          if-no-files-found: ignore
