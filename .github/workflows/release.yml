# Fork addition: stage pptx-templates on npm via trusted publishing (OIDC).
# No npm token is stored anywhere; npm exchanges the GitHub OIDC token for a
# short-lived credential that may only run `npm stage publish`. The version
# goes live only after a maintainer approves it with 2FA:
#   npm stage list pptx-templates
#   npm stage approve <stage-id>
#
# Release: bump "version" in package.json on main, then
#   git tag v0.1.0 && git push origin v0.1.0
# (upstream's tags are not fetched, see FORK.md "Releasing")
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, needed for the main check below

      # A tag belongs to a commit, not a branch: only publish tags whose
      # commit is already on main.
      - name: Verify the tag points to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # reads the Bun version from package.json#packageManager
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Node 26 ships npm >= 11.5.1, the minimum for trusted publishing
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Prepare test directories
        run: mkdir -p __tests__/pptx-output __tests__/pptx-cache

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # npm, not bun: npm stage publish (trusted publishing via OIDC) is npm-only.
      # Prerelease versions (1.2.3-beta.1) go to the "next" dist-tag, all
      # others to the default "latest". No explicit `--tag latest`: without
      # it npm refuses a version lower than the current latest, which keeps a
      # backport from moving latest backwards. The tag is fixed at staging
      # time; to change it, `npm stage reject` the staged version.
      # Skips a version that is already published (e.g. 0.1.0, published by
      # hand because trusted publishing can only be configured for an
      # existing package). A version that is staged but not yet approved is
      # invisible to `npm view`, so re-running before approval fails: the
      # version number is already taken by the staged package.
      - name: Stage
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "pptx-templates@$version" version >/dev/null 2>&1; then
            echo "::notice::pptx-templates@$version is already on npm, skipping"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm stage publish --access public --tag next
          else
            npm stage publish --access public
          fi
          echo "::notice::pptx-templates@$version staged, approve with: npm stage list pptx-templates && npm stage approve <stage-id>"

  # GitHub Release with the version's section of CHANGELOG.md as patch notes.
  # Runs only after `publish` succeeded (tests + staging).
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 {f=1; next}
            f && /^## \[/ {exit}
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version, falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          flags=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $flags
